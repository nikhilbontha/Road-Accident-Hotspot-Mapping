<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Accident Hotspot Mapping</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F2F3EF;--card:#fff;--ink:#1D2125;--mut:#6A7077;--ln:#DADCD5;--as:#1F2328;--ly:#F5B800;--c:#C62F2A;--h:#E2762B;--m:#E7B416;--l:#3E8E62;--tag:#EEF0EA;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171A;--card:#1E2227;--ink:#ECEEF0;--mut:#9AA0A6;--ln:#33383E;--tag:#2A2F35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171A;--card:#1E2227;--ink:#ECEEF0;--mut:#9AA0A6;--ln:#33383E;--tag:#2A2F35;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 'Fira Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100vh}.sb{width:210px;background:var(--as);color:#BFC4C9;padding:18px 14px;display:flex;flex-direction:column;gap:3px;flex:none;position:sticky;top:0;height:100vh}
.br{display:flex;gap:10px;align-items:center;color:#fff;font-weight:600;margin-bottom:18px;cursor:pointer}.br i{width:30px;height:30px;border-radius:8px;background:var(--ly);display:grid;place-items:center;font-style:normal}
.sb a{padding:9px 12px;border-radius:8px;cursor:pointer;color:inherit;text-decoration:none}.sb a.on{background:rgba(245,184,0,.16);color:#fff;box-shadow:inset 3px 0 0 var(--ly)}
.me{margin-top:auto;font-size:12.5px;color:#fff}.me small{display:block;color:#9AA0A6}
.mn{flex:1;min-width:0}.tp{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.tp h1{font-size:19px;font-weight:600}.tp small{color:var(--mut)}.ct{padding:20px 24px;display:grid;gap:16px}
.cd{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:16px 18px;min-width:0}.cd h3{font-size:14.5px;font-weight:600;margin-bottom:10px}
.g{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.k b{display:block;font-size:28px;font-weight:600}.mut{color:var(--mut)}.sm{font-size:12.5px}
.bt{padding:9px 16px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--ink);font:500 13.5px 'Fira Sans',sans-serif;cursor:pointer}.bt.p{background:var(--ly);border-color:var(--ly);color:#1D2125;font-weight:600}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:9px 12px;width:100%}input[type=checkbox],input[type=range]{width:auto;padding:0}
label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 4px}.ck{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:13.5px;margin:6px 0}
.ch{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}.tg{display:inline-block;padding:2px 8px;border-radius:5px;background:var(--tag);font-size:12px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:500;color:var(--mut);font-size:12.5px;padding:7px 10px;border-bottom:1px solid var(--ln)}td{padding:9px 10px;border-bottom:1px solid var(--ln);font-size:13.3px}tr:last-child td{border-bottom:0}
.bar{height:14px;background:var(--tag);border-radius:4px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--as)}.rw{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:13px}.rw span{width:150px}
.mp{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}@media(max-width:900px){.mp{grid-template-columns:1fr}.sb{position:static;height:auto;width:100%;flex-direction:row;overflow-x:auto;align-items:center}.app{flex-direction:column}.me{display:none}.br{margin:0 8px 0 0}}
svg.map{width:100%;height:auto;border-radius:10px;border:1px solid var(--ln);display:block;background:#E8EBE3}
.hero{background:var(--as);color:#fff;padding:20px 6vw 60px}.hero nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:60px}.hero h1{font-size:clamp(34px,6vw,56px);line-height:1.05;font-weight:600;max-width:640px}
.hero p{color:#B4BAC0;font-size:18px;max-width:520px;margin:18px 0 28px}.sec{padding:40px 6vw}.stp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}.stp div{border-top:3px solid var(--ly);padding-top:8px}
.au{max-width:420px;margin:7vh auto;padding:0 20px}.au h1{font-size:28px;font-weight:600;margin-bottom:6px}.note{background:#FFF3C4;color:#6B5200;padding:8px 11px;border-radius:7px;font-size:12.5px}
a.l{color:#8A6A00;font-weight:600;cursor:pointer}@media(prefers-color-scheme:dark){a.l{color:#F5B800}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),LV=["Critical","High","Medium","Low"],LC=["c","h","m","l"],ST=["Identified","Under review","Assigned","Action in progress","Implemented","Closed"];
function R(a){return()=>{a+=0x6D2B79F5;let r=Math.imul(a^a>>>15,1|a);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
const rnd=R(7),g=()=>(rnd()+rnd()+rnd()-1.5)*1.6;
const C=[["NH-65 × Station Road Junction",560,330,58,1],["Outer Ring Road, Exit 12",700,190,48,1],["Market Road Curve",350,430,34,0],["Bypass Road Underpass",250,170,30,0],["School Crossing, Ring Road",640,400,24,0],["Lake View Roundabout",470,500,20,0],["Old Town Bridge Approach",820,470,14,0],["Canal Road Bend",120,330,11,0]];
const SV=["Fatal","Grievous injury","Minor injury","Non-injury"];let D=[];
function mk(x,y,n){const h=n&&rnd()<.6?18+Math.floor(rnd()*6):Math.floor(rnd()*24),r=rnd(),s=r<.07?0:r<.25?1:r<.7?2:3;return{x,y,h,d:Math.floor(rnd()*7),s,m:Math.floor(rnd()*12),f:s==0?1:0,i:s==3?0:1+Math.floor(rnd()*2),L:h>=18||h<6?rnd()<.65:rnd()<.1,T:rnd()<.58,P:rnd()<.34,W:rnd()<.2}}
C.forEach(c=>{for(let k=0;k<c[3];k++)D.push(mk(c[1]+g()*14,c[2]+g()*14,c[4]))});for(let k=0;k<260;k++)D.push(mk(rnd()*1000,rnd()*640,0));
let S={cases:{},log:{},user:null,pend:[]};try{Object.assign(S,JSON.parse(localStorage.getItem("rah")||"{}"))}catch(e){}
const sv=()=>{try{localStorage.setItem("rah",JSON.stringify(S))}catch(e){}};
let P={eps:30,min:5,sev:[1,1,1,1],night:0},SEL=0,IM=null,H=[];
const US=[["Asha Reddy","Road Safety Analyst","asha@demo.in"],["Ravi Kumar","Traffic Police Officer","ravi@demo.in"],["Sana Fatima","Road Authority Official","sana@demo.in"]];
const can=a=>S.user&&(a=="import"?S.user.i<2:S.user.i!=0);
const lvl=s=>s>=80?0:s>=60?1:s>=40?2:3,chip=l=>`<span class="ch" style="background:var(--${LC[l]})${l==2?";color:#3a2f00":""}">${LV[l]}</span>`;
const filt=()=>D.filter(r=>P.sev[r.s]&&(!P.night||r.h>=18||r.h<6));
function db(p,e,mn){const n=p.length,lb=Array(n).fill(0),nb=i=>{const o=[];for(let j=0;j<n;j++)if((p[i].x-p[j].x)**2+(p[i].y-p[j].y)**2<=e*e)o.push(j);return o};let c=0;for(let i=0;i<n;i++){if(lb[i])continue;const N=nb(i);if(N.length<mn){lb[i]=-1;continue}c++;lb[i]=c;const q=N.slice();for(let k=0;k<q.length;k++){const j=q[k];if(lb[j]==-1)lb[j]=c;if(lb[j])continue;lb[j]=c;const M=nb(j);if(M.length>=mn)q.push(...M)}}return lb}
function an(){const A=filt(),lb=db(A,P.eps,P.min),m={};A.forEach((r,i)=>{if(lb[i]>0)(m[lb[i]]=m[lb[i]]||[]).push(r)});const used={};
let L=Object.values(m).map(a=>{const cx=a.reduce((s,r)=>s+r.x,0)/a.length,cy=a.reduce((s,r)=>s+r.y,0)/a.length;let nm="Area",bd=1e9;C.forEach(c=>{const d=Math.hypot(c[1]-cx,c[2]-cy);if(d<bd){bd=d;nm=c[0]}});used[nm]=(used[nm]||0)+1;if(used[nm]>1)nm+=" ("+used[nm]+")";const hr=Array(8).fill(0);a.forEach(r=>hr[r.h/3|0]++);const f=k=>a.filter(r=>r[k]).length;return{n:a.length,cx,cy,nm,hr,dt:a.reduce((s,r)=>s+r.f,0),inj:a.reduce((s,r)=>s+r.i,0),L:f("L"),T:f("T"),P:f("P"),W:f("W"),nn:hr[6]+hr[7]}});
const mx=k=>Math.max(1,...L.map(x=>x[k]));const a=mx("dt"),b=mx("n"),c=mx("inj");
L.forEach(x=>{x.pd=Math.round(45*x.dt/a);x.pf=Math.round(35*x.n/b);x.pi=Math.round(20*x.inj/c);x.sc=x.pd+x.pf+x.pi;x.lv=lvl(x.sc)});L.sort((x,y)=>y.sc-x.sc);L.forEach((x,i)=>x.id="H-"+String(i+1).padStart(3,"0"));H=L;if(SEL>=H.length)SEL=0}
const cs=n=>S.cases[n]||(S.cases[n]={st:1,as:""}),now=()=>new Date().toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"});
function lg(n,t){(S.log[n]=S.log[n]||[]).unshift({t:now(),x:t,u:S.user?S.user.n:"System"});sv()}
function shell(act,t,sub,body,right=""){const nv=[["dashboard","Dashboard"],["map","Hotspot Map"],["import","Data Import"],["cases","Hotspot Cases"]].filter(x=>x[0]!="import"||can("import"));
return`<div class="app"><div class="sb"><div class="br" onclick="location.hash='#/'"><i>📍</i><span>Hotspot Mapping</span></div>${nv.map(x=>`<a class="${x[0]==act?"on":""}" href="#/${x[0]}">${x[1]}</a>`).join("")}<a href="#/public">Public map</a><div class="me">${S.user.n}<small>${S.user.r}</small><a class="l" style="color:#F5B800;padding:6px 0" onclick="out()">Sign out</a></div></div><div class="mn"><div class="tp"><div><h1>${t}</h1><small>${sub}</small></div><div>${right}</div></div><div class="ct">${body}</div></div></div>`}
function out(){S.user=null;sv();location.hash="#/login"}
function land(){return`<div class="hero"><nav><div class="br" style="margin:0"><i>📍</i><span>Hotspot Mapping</span></div><div><button class="bt" onclick="location.hash='#/login'">Sign in</button> <button class="bt p" onclick="location.hash='#/signup'">Create account</button></div></nav><h1>Know which roads to fix first.</h1><p>Hotspot Mapping turns scattered accident records into a ranked map of dangerous road stretches, with the evidence behind every ranking.</p><button class="bt p" onclick="location.hash='#/signup'">Create an account</button> <button class="bt" style="background:none;color:#fff;border-color:#5A6068" onclick="location.hash='#/public'">View the public map</button><div class="sm" style="color:#8E959C;margin-top:16px">Rankings are advice for experts to check. Nothing changes on a road automatically. Demo data only.</div></div>
<div class="sec"><h2 style="margin-bottom:18px">From spreadsheet to action in seven steps</h2><div class="stp">${[["Collect","Add or upload records."],["Validate","Catch bad dates, duplicates, wrong coordinates."],["Analyze","Find clusters of accidents."],["Map","See hotspots on one map."],["Prioritize","Score from Critical to Low."],["Recommend","Suggestions with evidence."],["Track","Assign, update, record history."]].map((x,i)=>`<div><b>${i+1}. ${x[0]}</b><div class="mut sm">${x[1]}</div></div>`).join("")}</div></div>`}
function auth(s){return`<div class="au"><div class="br" style="color:var(--ink);margin-bottom:28px" onclick="location.hash='#/'"><i>📍</i><span>Hotspot Mapping</span></div>`+(s?`<h1>Create your account</h1><p class="mut">Use your work email. An administrator approves new accounts before you can sign in.</p><label>Full name</label><input id="n"><label>Work email</label><input id="e"><label>Role</label><select id="r"><option>Traffic Police Officer</option><option>Road Safety Analyst</option><option>Road Authority Official</option></select><label>Password (at least 10 characters)</label><input id="p" type="password"><p style="margin-top:14px"><button class="bt p" style="width:100%" onclick="reg()">Create account</button></p><div id="m" class="note" style="margin-top:12px;display:none"></div><p class="sm" style="margin-top:16px;text-align:center">Already have an account? <a class="l" href="#/login">Sign in</a></p>`:`<h1>Sign in</h1><p class="mut">Use your department account to continue.</p><label>Email</label><input id="e" value="asha@demo.in"><label>Password</label><input id="p" type="password" value="demo-password"><p style="margin-top:14px"><button class="bt p" style="width:100%" onclick="login()">Sign in</button></p><div id="m" class="note" style="margin-top:12px;display:none"></div><div class="cd" style="margin-top:18px"><b>Demo accounts</b>${US.map((u,i)=>`<div class="rw"><span style="width:auto;flex:1">${u[0]}<div class="mut sm">${u[1]}</div></span><button class="bt" onclick="as(${i})">Use</button></div>`).join("")}</div><p class="sm" style="margin-top:16px;text-align:center">New to the team? <a class="l" href="#/signup">Create an account</a> · <a class="l" href="#/public">Public map</a></p>`)+`</div>`}
function msg(t){const m=$("#m");m.style.display="block";m.textContent=t}
function as(i){S.user={n:US[i][0],r:US[i][1],i};sv();location.hash="#/dashboard"}
function login(){const i=US.findIndex(u=>u[2]==$("#e").value.trim().toLowerCase());if(i<0)return msg(S.pend.some(p=>p.e==$("#e").value.trim().toLowerCase())?"Your account is waiting for approval.":"No approved account found. Try a demo account or create one.");as(i)}
function reg(){const n=$("#n").value.trim(),e=$("#e").value.trim().toLowerCase();if(!n||!/^\S+@\S+\.\S+$/.test(e)||$("#p").value.length<10)return msg("Enter your name, a valid work email and a password of at least 10 characters.");S.pend.push({n,e,r:$("#r").value});sv();msg("Account created. An administrator approves new accounts before you can sign in.")}
function dash(){const T=D.length,F=D.reduce((s,r)=>s+r.f,0),I=D.reduce((s,r)=>s+r.i,0),mo=Array(12).fill(0),hb=Array(8).fill(0);D.forEach(r=>{mo[r.m]++;hb[r.h/3|0]++});const M=Math.max(...mo),B=Math.max(...hb),K=[0,0,0,0];H.forEach(h=>K[h.lv]++);
const kp=[["Accidents recorded",T],["Fatalities",F],["People injured",I],["Hotspots found",H.length],["Critical hotspots",K[0]]].map(x=>`<div class="cd k"><span class="mut sm">${x[0]}</span><b>${x[1].toLocaleString("en-IN")}</b></div>`).join("");
const mb=mo.map((v,i)=>`<rect x="${i*44+6}" y="${150-v/M*130}" width="32" height="${v/M*130}" rx="3" fill="#1F2328"/><text x="${i*44+22}" y="${144-v/M*130}" text-anchor="middle" font-size="10" fill="currentColor">${v}</text><text x="${i*44+22}" y="170" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6">${"JFMAMJJASOND"[i]}</text>`).join("");
const hh=hb.map((v,i)=>`<div class="rw"><span style="width:70px">${["12–3 am","3–6 am","6–9 am","9–12","12–3 pm","3–6 pm","6–9 pm","9–12 pm"][i]}</span><div class="bar"><i style="width:${v/B*100}%;background:${i>5?"var(--c)":"var(--as)"}"></i></div><b>${v}</b></div>`).join("");
return shell("dashboard","Dashboard",`${T} accident records · demo data`,`<div class="g g5">${kp}</div><div class="g g2"><div class="cd"><h3>Accidents by month</h3><div class="sc"><svg viewBox="0 0 530 176" style="min-width:420px;width:100%">${mb}</svg></div></div><div class="cd"><h3>Hotspots by risk level</h3>${LV.map((l,i)=>`<div class="rw"><span style="width:80px">${chip(i)}</span><div class="bar"><i style="width:${K[i]/Math.max(1,...K)*100}%;background:var(--${LC[i]})"></i></div><b>${K[i]}</b></div>`).join("")}<h3 style="margin-top:16px">When accidents happen</h3>${hh}</div></div>
<div class="cd"><h3>Hotspots that need action first</h3><div class="sc"><table><tr><th>#</th><th>Location</th><th>Risk</th><th>Accidents</th><th>Deaths</th><th>Status</th></tr>${H.slice(0,6).map(h=>`<tr><td>${h.id}</td><td><a class="l" href="#/case/${h.id}">${h.nm}</a></td><td>${chip(h.lv)}</td><td>${h.n}</td><td>${h.dt}</td><td>${ST[cs(h.nm).st]}</td></tr>`).join("")}</table></div></div>`)}
function mapsvg(pub){const rd=[["M-20 560C220 520 420 480 560 330S700 250 1020 160",16,"#D9AE3A"],["M330 -20C340 200 340 400 350 430S470 600 480 700",7],["M-20 230C200 250 380 255 520 270S700 300 1020 330",7],["M350 430C450 460 560 420 640 400S800 450 1020 480",6],["M700 -20C700 100 700 190 700 250S760 500 780 700",6]];
const bl=H.map((h,i)=>`<circle cx="${h.cx}" cy="${h.cy}" r="${Math.min(120,45+h.n*1.3)}" fill="url(#g${h.lv})"/>`).join("");
return`<svg class="map" viewBox="0 0 1000 640"><defs>${["#C62F2A","#E2762B","#E7B416","#3E8E62"].map((c,i)=>`<radialGradient id="g${i}"><stop offset="0" stop-color="${c}" stop-opacity=".6"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`).join("")}</defs>${rd.map(r=>`<path d="${r[0]}" stroke="${r[2]?"#D9AE3A":"#C7CABF"}" stroke-width="${r[1]+3}" fill="none"/><path d="${r[0]}" stroke="${r[2]?"#FBE7A1":"#fff"}" stroke-width="${r[1]}" fill="none"/>`).join("")}${bl}${pub?"":filt().map(r=>`<circle cx="${r.x}" cy="${r.y}" r="2.4" fill="#6E1410" opacity=".65"/>`).join("")}${H.map((h,i)=>`<g style="cursor:pointer" onclick="SEL=${i};route()">${i==SEL?`<circle cx="${h.cx}" cy="${h.cy}" r="22" fill="none" stroke="#1F2328" stroke-width="2"/>`:""}<circle cx="${h.cx}" cy="${h.cy}" r="13" fill="var(--${LC[h.lv]})" stroke="#fff" stroke-width="3"/><text x="${h.cx}" y="${h.cy+4.5}" text-anchor="middle" font-size="12" font-weight="700" fill="${h.lv==2?"#3a2f00":"#fff"}">${i+1}</text></g>`).join("")}</svg>`}
function setP(){P.eps=+$("#ep").value;P.min=+$("#mn").value;P.sev=[0,1,2,3].map(i=>$("#s"+i).checked?1:0);P.night=$("#nt").checked?1:0;an();route()}
function mapp(){const h=H[SEL];return shell("map","Hotspot Map",`${H.length} hotspots · ${filt().length} accidents in view`,`<div class="mp"><div>${mapsvg(0)}</div><div class="g"><div class="cd"><h3>Analysis settings</h3><label>Search radius: ${P.eps} units (about ${P.eps*8} m)</label><input id="ep" type="range" min="10" max="60" value="${P.eps}" onchange="setP()"><label>Minimum accidents: ${P.min}</label><input id="mn" type="range" min="3" max="12" value="${P.min}" onchange="setP()"><label>Severity</label>${SV.map((s,i)=>`<div class="ck"><input id="s${i}" type="checkbox" ${P.sev[i]?"checked":""} onchange="setP()">${s}</div>`).join("")}<div class="ck"><input id="nt" type="checkbox" ${P.night?"checked":""} onchange="setP()">Night only (6 pm – 6 am)</div></div>${h?`<div class="cd"><span class="mut sm">${h.id} · Rank ${SEL+1} of ${H.length}</span><h3 style="font-size:17px;margin:2px 0 8px">${h.nm}</h3>${chip(h.lv)} <span class="tg">${ST[cs(h.nm).st]}</span> <span class="mut sm">Score ${h.sc} / 100</span><p style="margin:12px 0"><b>${h.n}</b> accidents · <b>${h.dt}</b> deaths · <b>${h.inj}</b> injured</p><button class="bt p" onclick="location.hash='#/case/${h.id}'">Open details</button></div>`:`<div class="cd">No reliable hotspot can be determined from this data. Widen the radius or lower the minimum.</div>`}</div></div>`)}
function pubp(){an();const bd=n=>n>=40?"40+":n>=30?"30–39":n>=20?"20–29":n>=10?"10–19":"under 10",hd=S.user?`<a class="l" href="#/dashboard">Open workspace</a>`:`<button class="bt p" onclick="location.hash='#/login'">Sign in</button>`;
return`<div style="padding:14px 24px;display:flex;justify-content:space-between;align-items:center;background:var(--card);border-bottom:1px solid var(--ln);flex-wrap:wrap;gap:8px"><div class="br" style="color:var(--ink);margin:0" onclick="location.hash='#/'"><i>📍</i><span>Public hotspot map</span></div><span class="mut sm">Combined, anonymized figures · demo data</span>${hd}</div><div class="ct"><div class="mp"><div>${mapsvg(1)}</div><div class="cd"><h3>Areas to take extra care</h3>${H.slice(0,6).map((h,i)=>`<div class="rw"><span style="flex:1;width:auto">${h.nm}</span>${chip(h.lv)}<span class="mut sm" style="width:50px">${bd(h.n)}</span></div>`).join("")}<p class="mut sm" style="margin-top:12px">Areas are shown as bands, with no individual accidents or personal details.</p></div></div></div>`}
function csvdemo(){const r=["date,time,location,severity,lat,lon,vehicle_reg,phone"];for(let i=0;i<40;i++){const c=C[i%3];r.push(`2026-0${1+i%9}-${10+i%18},${String(8+i%14).padStart(2,"0")}:${String(i*7%60).padStart(2,"0")},${c[0]},${["Fatal","Minor","Grievous","Non-injury"][i%4]},${(17.45-(c[2]+i)/640*.15).toFixed(5)},${(78.4+(c[1]+i)/1000*.16).toFixed(5)},TS09AB${1000+i},98765432${String(10+i)}`)}r.push("2026-03-02,25:10,Market Road,Minor,17.40,78.45,TS09XY1111,9876500001","2026-04-05,,Ring Road,Fatal,17.41,78.47,,","2026-05-06,10:30,Lake View,Minor,95.1,78.44,,","2026-01-10,08:00,"+C[0][0]+",Grevious,"+(17.45-330/640*.15).toFixed(5)+","+(78.4+560/1000*.16).toFixed(5)+",,","2026-01-10,08:00,"+C[0][0]+",Grevious,"+(17.45-330/640*.15).toFixed(5)+","+(78.4+560/1000*.16).toFixed(5)+",,");return r.join("\n")}
function proc(t){const L=t.trim().split(/\r?\n/).slice(1),seen={},o={total:L.length,ok:0,fix:0,rej:0,mv:0,mp:0,is:[],rows:[]},sm={fatal:0,grievous:1,grevious:1,minor:2,"non-injury":3,none:3};
L.forEach((ln,k)=>{let c=ln.split(",").map(x=>x.trim());const iss=[];if(c[6]){o.mv++}if(c[7]){o.mp++}const sevk=(c[3]||"").toLowerCase().replace(" injury",""),s=sm[sevk],la=+c[4],lo=+c[5];
if(!/^\d{4}-\d{2}-\d{2}$/.test(c[0]||"")||isNaN(new Date(c[0])))iss.push(["Accident date is missing or invalid","Date"]);if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(c[1]||""))iss.push([`Time “${c[1]||"blank"}” is not valid`,"Time"]);if(s===undefined)iss.push(["Severity not recognised","Severity"]);if(isNaN(la)||isNaN(lo)||la<17.3||la>17.45||lo<78.4||lo>78.56)iss.push(["Latitude or longitude outside valid range","Location"]);
const key=c.slice(0,6).join("|");if(!iss.length&&seen[key])iss.push(["Duplicate of an earlier row","Record"]);seen[key]=1;
if(iss.length){o.rej++;iss.forEach(i=>o.is.push({r:k+2,m:i[0],f:i[1]}))}else{if(sevk=="grevious"){o.fix++;o.is.push({r:k+2,m:"“Grevious” changed to “Grievous injury”",f:"Severity",d:1})}else o.ok++;const d=new Date(c[0]);o.rows.push({x:(lo-78.4)/.16*1000,y:(17.45-la)/.15*640,h:+c[1].slice(0,2),d:d.getDay(),s,m:d.getMonth(),f:s==0?1:0,i:s==3?0:1+(s==1),L:0,T:0,P:0,W:0})}});IM=o;route()}
function pick(f){const r=new FileReader();r.onload=()=>proc(r.result);r.readAsText(f)}
function commit(){D.push(...IM.rows);lg("import",`Imported ${IM.rows.length} records`);const n=IM.rows.length;IM=null;an();route();alert(n+" records added. The map and dashboard now include them (this demo keeps them until you reload).")}
function imp(){const o=IM;return shell("import","Import accident data","Upload a CSV, check it, then add it to the map",`<div class="g g2"><div class="cd"><h3>1. Choose a file</h3><input type="file" accept=".csv" onchange="pick(this.files[0])"><p style="margin-top:10px"><button class="bt" onclick="proc(csvdemo())">Use a sample file</button></p><p class="mut sm" style="margin-top:10px">Accepted type: .csv. Required columns: date, time, location, severity, lat, lon. Vehicle and phone columns are masked and never stored.</p></div><div class="cd"><h3>2. Check results</h3>${o?`<div class="rw"><span style="width:auto;flex:1"><b style="font-size:22px">${o.ok}</b> ready</span><span style="width:auto;flex:1"><b style="font-size:22px">${o.fix}</b> corrected</span><span style="width:auto;flex:1"><b style="font-size:22px">${o.rej}</b> need attention</span></div><p class="sm mut">Personal details hidden: ${o.mv} vehicle numbers, ${o.mp} phone numbers.</p><p style="margin-top:12px"><button class="bt p" onclick="commit()" ${o.rows.length?"":"disabled"}>Import ${o.rows.length} records</button></p>`:`<p class="mut">Choose a file to see the data quality report.</p>`}</div></div>${o&&o.is.length?`<div class="cd"><h3>Issues found</h3><div class="sc"><table><tr><th>Row</th><th>What we found</th><th>Field</th><th>Result</th></tr>${o.is.map(i=>`<tr><td>${i.r}</td><td>${i.m}</td><td><span class="tg">${i.f}</span></td><td>${i.d?"Applied automatically":"Left out until fixed"}</td></tr>`).join("")}</table></div></div>`:""}`)}
function setSt(n,v){cs(n).st=+v;lg(n,"Status changed to "+ST[+v]);route()}
function setAs(n,v){const c=cs(n);c.as=v;if(v&&c.st<2)c.st=2;lg(n,v?"Assigned to "+v:"Unassigned");route()}
function cases(){return shell("cases","Hotspot Cases",`${H.length} hotspots · track each from found to fixed`,`<div class="cd"><div class="sc"><table><tr><th>ID</th><th>Location</th><th>Risk</th><th>Score</th><th>Accidents</th><th>Assigned to</th><th>Status</th></tr>${H.map(h=>{const c=cs(h.nm);return`<tr><td>${h.id}</td><td><a class="l" href="#/case/${h.id}">${h.nm}</a></td><td>${chip(h.lv)}</td><td>${h.sc}</td><td>${h.n}</td><td>${c.as||'<span class="mut">Unassigned</span>'}</td><td>${ST[c.st]}</td></tr>`}).join("")}</table></div></div>`)}
function detail(id){const h=H.find(x=>x.id==id);if(!h)return shell("cases","Hotspot not found","","<div class='cd'>This hotspot is not in the current analysis. <a class='l' href='#/cases'>Back to cases</a></div>");const c=cs(h.nm),mxh=Math.max(...h.hr),tb=["12a","3a","6a","9a","12p","3p","6p","9p"];
const fc=[["Two-wheelers involved",h.T,"Build a protected turning lane for two-wheelers"],["Poor lighting at night",h.L,"Install high-mast lighting on all approaches"],["Overspeeding",h.P,"Add warning signs and rumble strips on the approaches"],["Wet road",h.W,"Improve drainage and add anti-skid surfacing"]];
const rc=fc.filter(f=>f[1]/h.n>=.15).sort((a,b)=>b[1]-a[1]).map(f=>{const s=f[1]/h.n,cf=s>=.55&&f[1]>=20?"High":s>=.3&&f[1]>=10?"Medium":"Low";return`<div style="padding:9px 0;border-top:1px solid var(--ln)"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-weight:600">${f[2]}</b><span class="tg">Confidence: ${cf}</span></div><div class="mut sm">Addresses ${f[0].toLowerCase()} · ${f[1]} of ${h.n} crashes (${Math.round(s*100)}%)</div></div>`}).join("");
const nx=[c.st+1].filter(i=>i<6).concat(c.st>=4?[1]:[]);const ops=`<option value="${c.st}">${ST[c.st]}</option>`+nx.map(i=>`<option value="${i}">${i==1&&c.st>=4?"Reopen (Under review)":ST[i]}</option>`).join("");
const as=can("assign")?`<label>Assign to</label><select onchange="setAs(this.dataset.n,this.value)" data-n="${h.nm}"><option value="">Unassigned</option>${US.map(u=>`<option ${c.as==u[0]?"selected":""}>${u[0]}</option>`).join("")}</select><label>Status</label><select onchange="setSt(this.dataset.n,this.value)" data-n="${h.nm}">${ops}</select>`:`<p class="mut">Your role can view this hotspot but cannot assign it.</p>`;
const lgs=(S.log[h.nm]||[]).slice(0,6).map(e=>`<div style="padding:6px 0;border-top:1px solid var(--ln)" class="sm">${e.x}<div class="mut">${e.u} · ${e.t}</div></div>`).join("")||`<p class="mut sm">No activity yet.</p>`;
return shell("cases",`${h.id} · ${h.nm}`,`${ST[c.st]} · Score ${h.sc} / 100`,`<div class="g g5"><div class="cd k"><span class="mut sm">Risk level</span><b style="font-size:20px">${chip(h.lv)}</b></div><div class="cd k"><span class="mut sm">Risk score</span><b>${h.sc}</b></div><div class="cd k"><span class="mut sm">Accidents</span><b>${h.n}</b></div><div class="cd k"><span class="mut sm">Deaths</span><b>${h.dt}</b></div><div class="cd k"><span class="mut sm">Injured</span><b>${h.inj}</b></div></div>
<div class="g g2"><div class="cd"><h3>Accidents by time of day</h3>${h.hr.map((v,i)=>`<div class="rw"><span style="width:40px">${tb[i]}</span><div class="bar"><i style="width:${v/mxh*100}%;background:${v==mxh?"var(--c)":"var(--as)"}"></i></div><b>${v}</b></div>`).join("")}<h3 style="margin-top:14px">Why the score is ${h.sc}</h3><p class="sm">${h.pd} from deaths · ${h.pf} from number of accidents · ${h.pi} from injuries</p></div>
<div class="cd"><h3>Suggested actions</h3><div class="note" style="margin-bottom:6px">Suggested by the system · expert review needed</div>${rc||`<p class="mut">Not enough evidence for a suggestion. Collect more records.</p>`}</div></div>
<div class="g g2"><div class="cd"><h3>Assignment</h3>${as}<label>Add a comment</label><input id="cm" placeholder="Write a note"><p style="margin-top:8px"><button class="bt" onclick="if($('#cm').value.trim()){lg('${h.nm.replace(/'/g,"\\'")}','Comment: '+$('#cm').value.trim());route()}">Add comment</button></p></div><div class="cd"><h3>Activity</h3>${lgs}</div></div>`)}
function route(){const[p,a]=(location.hash.slice(2)||"").split("/");if(!["","login","signup","public"].includes(p)&&!S.user){location.hash="#/login";return}if(p=="import"&&!can("import")){location.hash="#/dashboard";return}
if(!H.length||p!="map")an();const f={"":land,login:()=>auth(0),signup:()=>auth(1),public:pubp,dashboard:dash,map:mapp,import:imp,cases,case:()=>detail(a)}[p]||land;$("#app").innerHTML=f();scrollTo(0,0)}
addEventListener("hashchange",route);route();
</script></body></html>

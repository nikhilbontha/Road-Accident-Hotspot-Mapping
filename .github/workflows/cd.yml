name: Continuous Deployment

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        run: echo "Configured for AWS ECR / Azure Container Registry"

      - name: Build & Tag Multi-arch Images
        run: |
          docker build -t rah-backend:latest ./backend
          docker build -t rah-frontend:latest ./frontend
